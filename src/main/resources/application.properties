# Configuração do Servidor Dashboard ESP32
server.port=8080
server.servlet.context-path=/

# Logging
logging.level.root=WARN
logging.level.com.fiap.eca=INFO

# ========================
# Leitura Serial do Arduino/ESP8266
# Para macOS, normalmente a porta é algo como /dev/tty.usbserial-xxxx ou /dev/tty.usbmodemxxxx
# Porta serial (macOS): exemplo fornecido pelo usuário
serial.port=/dev/cu.usbserial-0001
serial.baud=9600

# Configurações de timeout para melhorar a conectividade
serial.timeout.read=5000
serial.timeout.write=1000
serial.reconnect.delay=5000
serial.max.attempts=5